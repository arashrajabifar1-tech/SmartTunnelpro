name: Native source contract inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-source-inspection.yml'

permissions:
  contents: read

jobs:
  inspect-native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'SmartTunnelAndroid-0.22.0-source*.zip' -print | sort | tail -n 1)"
          test -n "$ZIP" && test -s "$ZIP"
          mkdir -p "$RUNNER_TEMP/smarttunnel-inspect"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/smarttunnel-inspect"
          ROOT="$(find "$RUNNER_TEMP/smarttunnel-inspect" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Archive: $ZIP"
          echo "Project root: $ROOT"
          find "$ROOT/app/src/main" -maxdepth 7 -type f \( -name '*.kt' -o -name '*.java' -o -name 'index.html' -o -name 'AndroidManifest.xml' \) -print | sort
      - name: Inspect native bridge method contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, os
          root = Path(os.environ["SOURCE_ROOT"])
          candidates = list(root.rglob("*.kt")) + list(root.rglob("*.java"))
          keys = ("JavascriptInterface", "SmartTunnelNative", "probeThroughTunnel", "speedTestThroughTunnel",
                  "startVpn", "stopVpn", "validateConfig", "getStatus", "requestVpn", "VpnService")
          for p in candidates:
              try: lines = p.read_text(errors="replace").splitlines()
              except OSError: continue
              hits = [i for i, line in enumerate(lines) if any(k in line for k in keys)]
              if not hits: continue
              print(f"\n===== {p.relative_to(root)} =====")
              shown = set()
              for i in hits:
                  lo, hi = max(0, i-2), min(len(lines), i+4)
                  for j in range(lo, hi):
                      if j not in shown:
                          print(f"{j+1:04d}: {lines[j]}")
                          shown.add(j)
          htmls = list((root / "app/src/main/assets").glob("*.html"))
          for p in htmls:
              lines = p.read_text(errors="replace").splitlines()
              hits = [i for i,line in enumerate(lines) if any(k in line for k in keys)]
              if hits:
                  print(f"\n===== {p.relative_to(root)} bridge call sites =====")
                  shown=set()
                  for i in hits:
                      lo,hi=max(0,i-1),min(len(lines),i+2)
                      for j in range(lo,hi):
                          if j not in shown:
                              line=lines[j]
                              print(f"{j+1:04d}: {line[:300]}")
                              shown.add(j)
          PY
      - name: Verify required Android VPN permission declarations
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find "$SOURCE_ROOT/app/src/main" -name AndroidManifest.xml -print -quit)"
          test -n "$MANIFEST"
          grep -nE 'BIND_VPN_SERVICE|android.net.VpnService|android.permission.INTERNET' "$MANIFEST"
          grep -RniE 'probeThroughTunnel|speedTestThroughTunnel|validateConfig|getStatus' "$SOURCE_ROOT/app/src/main/java" || true
