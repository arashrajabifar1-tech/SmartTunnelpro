          (res / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text(adaptive)
          (res / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text(adaptive)
          svg = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Smart Tunnel green S blue circle"><circle cx="54" cy="54" r="38" fill="#247BFF"/><path d="M72 36 C63 27 45 27 35 34 C25 41 29 50 42 55 L61 62 C75 68 72 81 59 87 C47 92 31 88 26 80" fill="none" stroke="#3BE88D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>"""
          (Path("app/src/main/assets") / "smart_tunnel_icon.svg").write_text(svg)
          # Replace the previous placeholder launcher artwork with the supplied icon asset.
          import os
          from io import BytesIO
          import cairosvg
          from PIL import Image, ImageOps
          supplied_icon = Path(os.environ["GITHUB_WORKSPACE"]) / "smart_tunnel_icon.svg"
          if not supplied_icon.is_file():
              raise SystemExit("Supplied smart_tunnel_icon.svg is missing from the repository root")
          svg_text = supplied_icon.read_text(encoding="utf-8")
          import re, base64
          match = re.search(r'href="data:image/(?:jpeg|png);base64,([^"]+)', svg_text)
          if not match:
              raise SystemExit("Supplied SVG does not contain the embedded source image")
          raw_image = base64.b64decode(match.group(1))
          icon_image = Image.open(BytesIO(raw_image)).convert("RGBA")
          icon_image = ImageOps.fit(icon_image, (432, 432), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          nodpi = res / "drawable-nodpi"
          nodpi.mkdir(parents=True, exist_ok=True)
          (res / "drawable" / "st_icon_foreground.xml").unlink(missing_ok=True)
          (res / "drawable" / "st_icon_monochrome.xml").unlink(missing_ok=True)
          icon_image.save(nodpi / "st_icon_foreground.png", format="PNG", optimize=True)
          gray = ImageOps.grayscale(icon_image)
          alpha = gray.point(lambda p: 255 if p >= 52 else 0)
          mono = Image.new("RGBA", icon_image.size, (255, 255, 255, 0))
          mono.putalpha(alpha)
          mono.save(nodpi / "st_icon_monochrome.png", format="PNG", optimize=True)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = res / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              scaled = icon_image.resize((size,size), Image.Resampling.LANCZOS)
              scaled.save(folder / "ic_launcher.png", format="PNG", optimize=True)
              scaled.save(folder / "ic_launcher_round.png", format="PNG", optimize=True)
          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace("versionCode = 220", "versionCode = 230").replace('versionName = "0.22.0"', 'versionName = "0.23.0"')
          g = g.replace("versionCode = 230", "versionCode = 245").replace('versionName = "0.23.0"', 'versionName = "0.24.5"')
          g = g.replace('abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")', 'abiFilters += listOf("arm64-v8a")')
          gradle.write_text(g)
          validator = Path("scripts/validate_project.py")
          v = validator.read_text()
          v = v.replace("Smart Tunnel v0.22.0", "Smart Tunnel v0.23.0")
          v = v.replace("HTML version is 0.22.0", "HTML version is 0.23.0")
          v = v.replace('versionName = "0.22.0"', 'versionName = "0.23.0"')
          v = v.replace("versionCode = 220", "versionCode = 230")
          v = v.replace("Android app version is 0.22.0 / code 220", "Android app version is 0.23.0 / code 230")
          v = v.replace("SmartTunnel-0.22.0-debug-apk", "SmartTunnel-0.24.5-arm64-debug-apk")
          v = v.replace("0.23.0", "0.24.5").replace("code 230", "code 245").replace("versionCode = 230", "versionCode = 245")
          validator.write_text(v)
          embedded_workflow = Path(".github/workflows/android-apk.yml")
          if embedded_workflow.exists():
              ew = embedded_workflow.read_text()
              ew = ew.replace("SmartTunnel-0.22.0-debug-apk", "SmartTunnel-0.24.5-arm64-debug-apk")
              ew = ew.replace("0.22.0", "0.23.0")
              ew = ew.replace("0.23.0", "0.24.5")
              embedded_workflow.write_text(ew)
          print("Applied v0.24.5 circuit glass UI, animated splash, branded launcher icon, and ARM64-only APK configuration")
          PY

      - name: Add three-destination bottom navigation
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="stBottomNavV245"'
          if marker not in s:
              css = """
          /* Smart Tunnel v0.24.5 — three-destination bottom navigation */
          #stBottomNavV245{position:fixed;z-index:999;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));background:rgba(5,14,26,.96);border-top:1px solid rgba(125,180,230,.25);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
          #stBottomNavV245 button{min-width:0;min-height:48px;border:1px solid rgba(125,180,230,.22);border-radius:14px;background:rgba(22,39,61,.92);color:#a9c3d8;padding:8px 5px;font:inherit;font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:6px}
          #stBottomNavV245 button.active{background:linear-gradient(135deg,#155c9a,#0c765d);border-color:#51d8ad;color:#fff}
          #stBottomNavV245 button:focus-visible{outline:2px solid #51d8ad;outline-offset:2px}
          body{padding-bottom:calc(94px + env(safe-area-inset-bottom))!important}
          """
              style_end=s.rfind("</style>")
              if style_end < 0: raise SystemExit("Cannot add bottom navigation: stylesheet not found")
              s=s[:style_end]+css+"\n"+s[style_end:]
              nav = '''
          <nav id="stBottomNavV245" aria-label="ناوبری اصلی سه‌بخشی" role="navigation">
            <button type="button" data-st-destination="home" class="active" aria-current="page">⌂ <span>خانه</span></button>
            <button type="button" data-st-destination="profiles">⇄ <span>سرورها</span></button>
            <button type="button" data-st-destination="tools">✣ <span>ابزارها</span></button>
          </nav>
          <script>
          (function(){
            const nav=document.getElementById("stBottomNavV245"); if(!nav)return;
            const group=id=>(id==="home"||id==="subscription"||id==="learn")?"home":((id==="profiles"||id==="ext")?"profiles":"tools");
            function sync(id){const active=group(id);nav.querySelectorAll("[data-st-destination]").forEach(b=>{const yes=b.dataset.stDestination===active;b.classList.toggle("active",yes);if(yes)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
            nav.addEventListener("click",e=>{const b=e.target.closest("[data-st-destination]");if(!b)return;const id=b.dataset.stDestination;const tab=document.querySelector('.tab[data-tab="'+id+'"]');if(tab)tab.click();else if(typeof window.showTab==="function")window.showTab(id);sync(id);window.scrollTo({top:0,behavior:"smooth"})});
            document.querySelectorAll(".tab[data-tab]").forEach(t=>t.addEventListener("click",()=>sync(t.dataset.tab)));
            sync("home");
          })();
          </script>
          '''
              end=s.lower().rfind("</body>")
              if end<0: raise SystemExit("Cannot add bottom navigation: body end not found")
              s=s[:end]+nav+"\n"+s[end:]
