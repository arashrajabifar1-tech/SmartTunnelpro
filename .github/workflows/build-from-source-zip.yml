      - name: Integrate Native failover and run bridge contract tests
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/integrate_failover.py" "$PWD"
          python "$GITHUB_WORKSPACE/scripts/test_native_failover_contract.py" "$PWD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static source validation
        working-directory: ${{ steps.source.outputs.root }}
        run: python scripts/validate_project.py

      - name: Run Chromium UI regression tests
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke_test.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.root }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Calculate APK checksum
        working-directory: ${{ steps.source.outputs.root }}
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTunnel-0.24.5-arm64-debug-apk
          path: ${{ steps.source.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="SmartTunnel-0.24.5-arm64.apk"
          cp "${{ steps.source.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          if gh release view v0.24.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.24.5 "$APK_NAME" "$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v0.24.5 --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.24.5 "$APK_NAME" "$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Smart Tunnel Pro v0.24.5 (ARM64)" --latest --notes "Smart Tunnel Pro v0.24.5: ARM64 build with Native failover wired to requestVpn/testThroughTunnel/validateConfig, real HTTPS-204 probe contract checks, Persian mobile-first connection/import/speed-test UI, green S in a blue-circle launcher icon, static validation and Chromium regression tests. A valid proxy/server profile is required for real tunneling. Debug-signed APK; CI verifies native bridge contract and build, but cannot certify a live tunnel without a valid user-owned server profile. Physical-device connectivity, DNS/IPv6 leak, and Google Play release-signing tests are not implied."
          fi
