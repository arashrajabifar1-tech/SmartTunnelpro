name: Build Smart Tunnel APK from uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'SmartTunnelAndroid-0.22.0-source*.zip'
      - '.github/workflows/build-from-source-zip.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'SmartTunnelAndroid-0.22.0-source*.zip' -print | sort | tail -n 1)"
          test -n "$ZIP" && test -s "$ZIP" || { echo "Missing source ZIP. Upload SmartTunnelAndroid-0.22.0-source*.zip to the repository root."; exit 1; }
          echo "Using source archive: $ZIP"
          mkdir -p "$RUNNER_TEMP/smarttunnel-src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/smarttunnel-src"
          ROOT="$(find "$RUNNER_TEMP/smarttunnel-src" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$ROOT" || { echo "settings.gradle.kts was not found in the uploaded ZIP."; exit 1; }
          test -f "$ROOT/.github/workflows/android-apk.yml" || { echo "Android project workflow file is missing inside the ZIP."; exit 1; }
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply libbox API compatibility fixes
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/smarttunnel/app/vpn/VpnEngine.kt")
          s = p.read_text()
          replacements = [
              ("import io.nekohasekai.libbox.AutoRedirectHandler\n", ""),
              ("import io.nekohasekai.libbox.AutoRedirectSession\n", ""),
              ("                dnsSearchDomain = StringArray(props.domains?.split(' ')?.filter { it.isNotBlank() }.orEmpty().iterator())\n", ""),
              ("    override fun usePlatformAutoRedirect(): Boolean = false\n", ""),
              ("    override fun createAutoRedirect(options: ByteArray?, handler: AutoRedirectHandler?): AutoRedirectSession = error(\"Platform auto-redirect is not available\")\n", ""),
              ("    private fun String.toIpPrefix(): IpPrefix = IpPrefix(this)", """    private fun String.toIpPrefix(): IpPrefix {
                  val parts = split("/", limit = 2)
                  val address = java.net.InetAddress.getByName(parts[0])
                  val prefix = parts.getOrNull(1)?.toIntOrNull()
                      ?: if (address is Inet6Address) 128 else 32
                  require(prefix in 0..if (address is Inet6Address) 128 else 32) { "Invalid IP prefix: $this" }
                  return IpPrefix(address, prefix)
              }"""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Expected source pattern not found: " + old[:100].replace("\n", "\\n"))
              s = s.replace(old, new, 1)
          route_fixes = [
              ("builder.addRoute(v4Routes.next().toIpPrefix())", "v4Routes.next().let { builder.addRoute(it.address(), it.prefix()) }"),
              ("builder.addRoute(v6Routes.next().toIpPrefix())", "v6Routes.next().let { builder.addRoute(it.address(), it.prefix()) }"),
              ("builder.excludeRoute(ex4.next().toIpPrefix())", "ex4.next().let { builder.excludeRoute(IpPrefix(java.net.InetAddress.getByName(it.address()), it.prefix())) }"),
              ("builder.excludeRoute(ex6.next().toIpPrefix())", "ex6.next().let { builder.excludeRoute(IpPrefix(java.net.InetAddress.getByName(it.address()), it.prefix())) }"),
          ]
          for old, new in route_fixes:
              if old not in s:
                  raise SystemExit("Expected route source pattern not found: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          # Upgrade the bundled UI and Android package for v0.23.0.
          html = Path("app/src/main/assets/index.html")
          h = html.read_text()
          h = h.replace("v0.22.0", "v0.23.0").replace("0.22.0", "0.23.0")
          if "/* Smart Tunnel glass UI v0.23.1 */" not in h:
              style_end = h.rfind("</style>")
              if style_end < 0:
                  raise SystemExit("Could not locate stylesheet for glass UI")
              glass_css = r'''/* Smart Tunnel glass UI v0.23.1 */
          #quickStartCard.st-glass-hero{position:relative;isolation:isolate;display:grid;gap:18px;overflow:hidden;margin:14px 0 22px;padding:clamp(18px,4vw,28px);border:1px solid color-mix(in srgb,#8ec2ff 25%,transparent);border-radius:30px;background:linear-gradient(145deg,color-mix(in srgb,#18334f 96%,transparent),color-mix(in srgb,#09182a 94%,transparent));color:#f3f8ff;box-shadow:0 22px 58px color-mix(in srgb,#020817 38%,transparent),inset 0 1px 0 color-mix(in srgb,#ffffff 12%,transparent);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}
          #quickStartCard.st-glass-hero:before{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse at 85% 0%,color-mix(in srgb,#2587ff 22%,transparent),transparent 55%),radial-gradient(ellipse at 6% 80%,color-mix(in srgb,#27e58c 10%,transparent),transparent 45%)}
          #quickStartCard .st-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
          #quickStartCard .st-brand-lockup{display:flex;align-items:center;gap:12px;min-width:0}
          #quickStartCard .st-logo{width:50px;height:50px;flex:0 0 50px;filter:drop-shadow(0 5px 14px color-mix(in srgb,#247bff 38%,transparent))}
          #quickStartCard .st-brand-copy{display:grid;gap:4px;min-width:0}
          #quickStartCard .st-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;color:#8abaff}
          #quickStartCard .st-hero-title{font-size:clamp(18px,3.4vw,24px);font-weight:850;line-height:1.5;color:#f5f9ff}
          #quickStartCard .st-status-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid color-mix(in srgb,#42e99a 28%,transparent);border-radius:999px;background:color-mix(in srgb,#24d883 9%,transparent);font-size:11px;white-space:nowrap;color:#a6f5ce}
          #quickStartCard .st-status-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#43e994;box-shadow:0 0 12px color-mix(in srgb,#43e994 72%,transparent)}
          #quickStartCard .st-connect-layout{display:grid;grid-template-columns:minmax(0,1fr) 158px;align-items:center;gap:20px;padding:6px 2px}
          #quickStartCard .st-hero-copy{display:grid;gap:13px;min-width:0}
          #quickStartCard .st-hero-description{margin:0;color:#bdcde0;font-size:13px;line-height:1.95}
          #quickStartCard #quickStatus{margin:0;padding:11px 13px;border:1px solid color-mix(in srgb,#b7d5ff 13%,transparent);border-radius:15px;background:color-mix(in srgb,#d9eaff 5%,transparent);color:#d9e7f8;font-size:12px;line-height:1.85}
          #quickStartCard #quickStatus.ok{border-color:color-mix(in srgb,#35e999 30%,transparent);background:color-mix(in srgb,#35e999 8%,transparent);color:#b9f8d8}
          #quickStartCard #quickStatus.bad{border-color:color-mix(in srgb,#ff7185 35%,transparent);background:color-mix(in srgb,#ff7185 8%,transparent);color:#ffc1ca}
          #quickStartCard .st-connect-orb{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:148px;height:148px;justify-self:center;padding:0;border:1px solid color-mix(in srgb,#9ecbff 52%,transparent);border-radius:50%;background:radial-gradient(circle at 35% 24%,#2b8aff,#1351b5 58%,#0b2a64);box-shadow:0 0 0 8px color-mix(in srgb,#2c8aff 9%,transparent),0 14px 34px color-mix(in srgb,#247bff 32%,transparent),inset 0 1px 1px color-mix(in srgb,#ffffff 36%,transparent);color:#fff;cursor:pointer;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
          #quickStartCard .st-connect-orb:before{content:"";position:absolute;inset:-8px;border:1px solid color-mix(in srgb,#6eb2ff 30%,transparent);border-radius:50%;pointer-events:none}
          #quickStartCard .st-connect-orb:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 0 0 9px color-mix(in srgb,#2c8aff 12%,transparent),0 18px 42px color-mix(in srgb,#247bff 38%,transparent)}
          #quickStartCard .st-connect-orb:active{transform:scale(.97)}
          #quickStartCard .st-connect-orb:focus-visible{outline:3px solid #61e9a2;outline-offset:7px}
          #quickStartCard .st-power-icon{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
          #quickStartCard .st-connect-label{font-size:20px;line-height:1.2;font-weight:850}
          #quickStartCard .st-connect-caption{font-size:10px;color:#c9ddff;font-weight:600}
          #quickStartCard .st-config-details{border:1px solid color-mix(in srgb,#b9d7ff 16%,transparent);border-radius:17px;background:color-mix(in srgb,#d8e9ff 4%,transparent);overflow:hidden}
          #quickStartCard .st-config-details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;cursor:pointer;color:#ecf5ff;font-size:13px;font-weight:750}
          #quickStartCard .st-config-details>summary::-webkit-details-marker{display:none}
          #quickStartCard .st-config-details>summary:after{content:"＋";font-size:17px;color:#91c1ff}
          #quickStartCard .st-config-details[open]>summary:after{content:"−"}
          #quickStartCard .st-config-fields{display:grid;gap:12px;padding:0 14px 14px}
          #quickStartCard .st-field-label{display:block;margin-bottom:7px;color:#bdcde0;font-size:12px;font-weight:650}
          #quickStartCard #quickConfigInput,#quickStartCard #quickConfigFile{display:block;width:100%;box-sizing:border-box;border:1px solid color-mix(in srgb,#b4d3ff 20%,transparent);border-radius:13px;background:color-mix(in srgb,#020b18 54%,transparent);color:#f2f7ff;padding:11px 12px;font:inherit;font-size:12px;outline:none}
          #quickStartCard #quickConfigInput{resize:vertical;min-height:86px;line-height:1.7}
          #quickStartCard #quickConfigInput:focus,#quickStartCard #quickConfigFile:focus{border-color:#5aa5ff;box-shadow:0 0 0 3px color-mix(in srgb,#328aff 18%,transparent)}
          #quickStartCard .st-action-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
          #quickStartCard .st-action-row .btn{width:100%;min-width:0;min-height:44px;border-radius:13px;padding:10px 9px;white-space:normal;line-height:1.55;font-size:12px;border:1px solid color-mix(in srgb,#b9d7ff 18%,transparent);background:color-mix(in srgb,#cfe4ff 7%,transparent);color:#e7f2ff;box-shadow:none}
          #quickStartCard .st-action-row .btn:hover{background:color-mix(in srgb,#4a9bff 16%,transparent);border-color:color-mix(in srgb,#8ec2ff 40%,transparent)}
          @media(max-width:560px){#quickStartCard.st-glass-hero{padding:17px;border-radius:25px;gap:16px}#quickStartCard .st-hero-top{align-items:flex-start}#quickStartCard .st-logo{width:44px;height:44px;flex-basis:44px}#quickStartCard .st-status-pill{font-size:10px;padding:6px 8px}#quickStartCard .st-connect-layout{grid-template-columns:1fr;gap:15px;text-align:center}#quickStartCard .st-hero-copy{order:2}#quickStartCard .st-connect-orb{order:1;width:142px;height:142px}#quickStartCard .st-action-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(prefers-reduced-motion:reduce){#quickStartCard .st-connect-orb{transition:none}}'''
              h = h[:style_end] + glass_css + "\n" + h[style_end:]
          old_speed = "if(results.some(x=>x.ok))alert(`تست پایان یافت: ${results.filter(x=>x.ok).length}/${results.length} کانفیگ اندازه‌گیری شد. برای استفاده، کانفیگ مطلوب را از صفحهٔ مسیرها انتخاب و دوباره اتصال را دستی برقرار کن.`);"
          new_speed = "if(results.some(x=>x.ok)){const best=list.filter(p=>historyFor(p.id)).sort(measuredSpeedSort)[0];if(best){data.selectedId=best.id;save();render();}alert(`تست پایان یافت: ${results.filter(x=>x.ok).length}/${results.length} کانفیگ اندازه‌گیری شد. سریع‌ترین کانفیگ اندازه‌گیری‌شده انتخاب شد: ${best?best.name:'—'}. برای اتصال، دکمهٔ اتصال را جداگانه بزن.`);}"
          if old_speed in h:
              h = h.replace(old_speed, new_speed, 1)
          else:
              raise SystemExit("Could not locate speed benchmark completion handler")
          home_marker = '<div class="card half"><div class="row"><strong>مسیر منتخب</strong>'
          quick_card = """<div class="card st-glass-hero" id="quickStartCard" dir="rtl">
          <div class="st-hero-top">
            <div class="st-brand-lockup">
              <svg class="st-logo" viewBox="0 0 108 108" role="img" aria-label="Smart Tunnel">
                <circle cx="54" cy="54" r="38" fill="#247BFF"></circle>
                <path d="M72 36 C63 27 45 27 35 34 C25 41 29 50 42 55 L61 62 C75 68 72 81 59 87 C47 92 31 88 26 80" fill="none" stroke="#3BE88D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <div class="st-brand-copy"><span class="st-eyebrow">SMART TUNNEL PRO · 0.23.1</span><strong class="st-hero-title">اتصال امن، ساده و سریع</strong></div>
            </div>
            <span class="st-status-pill">آمادهٔ اتصال</span>
          </div>
          <div class="st-connect-layout">
            <div class="st-hero-copy">
              <p class="st-hero-description">برای شروع، یک کانفیگ معتبر اضافه کن؛ بعد دکمهٔ اتصال را بزن و مجوز VPN اندروید را تأیید کن.</p>
              <div id="quickStatus" class="notice" role="status" aria-live="polite">آماده. برای اتصال باید کانفیگ یا اشتراک معتبر خودت را وارد کنی.</div>
            </div>
            <button class="st-connect-orb" id="quickConnectBtn" type="button" aria-label="شروع اتصال VPN">
              <svg class="st-power-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"></path><path d="M5.6 5.6a9 9 0 1 0 12.8 0"></path></svg>
              <span class="st-connect-label">اتصال</span><span class="st-connect-caption">VPN</span>
            </button>
          </div>
          <details class="st-config-details">
            <summary>افزودن کانفیگ یا فایل اتصال</summary>
            <div class="st-config-fields">
              <div><label class="st-field-label" for="quickConfigInput">لینک کانفیگ، اشتراک یا متن JSON / Clash</label><textarea id="quickConfigInput" rows="4" placeholder="vless://… یا vmess://… یا لینک https اشتراک"></textarea></div>
              <div><label class="st-field-label" for="quickConfigFile">یا انتخاب فایل کانفیگ</label><input id="quickConfigFile" type="file" accept=".json,.yaml,.yml,.txt,.conf,.confing,.subscription,text/plain,application/json,application/x-yaml"></div>
              <button class="btn primary" id="quickImportBtn" type="button">واردکردن کانفیگ</button>
            </div>
          </details>
          <div class="st-action-row">
            <button class="btn" id="quickDiscoverBtn" type="button">یافتن کانفیگ</button>
            <button class="btn" id="quickSpeedBtn" type="button">تست سرعت</button>
            <button class="btn" id="quickProfilesBtn" type="button">مدیریت سرورها</button>
          </div>
          </div>
          """
          if 'id="quickStartCard"' not in h:
              if home_marker not in h:
                  raise SystemExit("Could not locate dashboard insertion point")
              h = h.replace(home_marker, quick_card + home_marker, 1)
          js_marker = "function xmsg(s){const e=$('xMsg');if(e)e.textContent=s}"
          quick_js = r'''
          function quickStatus(message,kind){
            const e=$('quickStatus'); if(!e)return;
            e.textContent=String(message||'');
            e.className='notice'+(kind?' '+kind:'');
          }
          function quickShowTab(id){
            const t=document.querySelector('.tab[data-tab="'+id+'"]');
            if(t)t.click();
          }
          function quickImportText(text){
            const raw=String(text||'').trim();
            if(!raw)throw new Error('ابتدا لینک یا متن کانفیگ را وارد کن.');
            const before=data.profiles.length;
            const result=importText(raw);
            const added=data.profiles.length-before;
            if(added){
              const newest=data.profiles.slice(before).filter(p=>p.type!=='direct');
              newest.forEach(p=>{p.enabled=true;});
              if(newest.length)data.selectedId=newest[0].id;
              save();
            }
            if(result.subs>0 || result.subsAdded>0){
              quickStatus('لینک اشتراک شناسایی شد. نتیجهٔ دریافت را در تب Subscription بررسی کن.', 'ok');
            }else if(added){
              quickStatus(added+' کانفیگ اضافه شد. برای تست سرعت به «ابزارها» برو؛ سپس می‌توانی اتصال را امتحان کنی.', 'ok');
            }else if(result.dup){
              quickStatus('این کانفیگ‌ها از قبل وجود دارند؛ مورد تکراری اضافه نشد.', 'ok');
            }else{
              quickStatus('قالب قابل شناسایی پیدا نشد. لینک تکی، Base64، Clash YAML یا sing-box JSON را امتحان کن.', 'bad');
            }
            return result;
          }
          const quickImportButton=$('quickImportBtn');
          if(quickImportButton)quickImportButton.addEventListener('click',()=>{
            try{quickImportText($('quickConfigInput').value);}
            catch(e){quickStatus(e.message,'bad');}
          });
          const quickFile=$('quickConfigFile');
          if(quickFile)quickFile.addEventListener('change',async()=>{
            const file=quickFile.files&&quickFile.files[0]; if(!file)return;
            if(file.size>2*1024*1024){quickStatus('فایل بیش از ۲ مگابایت است؛ فایل کوچک‌تر انتخاب کن.','bad');quickFile.value='';return;}
            try{const text=await file.text();$('quickConfigInput').value=text;quickImportText(text);}
            catch(e){quickStatus('خواندن فایل ناموفق بود: '+e.message,'bad');}
          });
          const quickConnectButton=$('quickConnectBtn');
          if(quickConnectButton)quickConnectButton.addEventListener('click',()=>{
            try{
              if(!nativeAvailable())throw new Error('اتصال VPN واقعی فقط داخل APK نصب‌شده در دسترس است.');
              const usable=data.profiles.filter(p=>p.enabled&&p.type!=='direct'&&p.type!=='wireguard');
              if(!usable.length)throw new Error('ابتدا یک کانفیگ پروکسی معتبر وارد و فعال کن.');
              const config=buildConfig();
              if(!config.route||!config.route.final||config.route.final==='direct')throw new Error('مسیر نهایی به سرور پروکسی وصل نیست؛ کانفیگ را بررسی کن.');
              const response=nativeCall('requestVpn',JSON.stringify(config));
              if(String(response)!=='OK')throw new Error(String(response));
              quickStatus('درخواست اتصال ارسال شد؛ مجوز VPN اندروید را تأیید کن و وضعیت بالای صفحه را بررسی کن.','ok');
              quickShowTab('engine');
            }catch(e){quickStatus(e.message,'bad');}
          });
          const quickProfilesButton=$('quickProfilesBtn');
          if(quickProfilesButton)quickProfilesButton.addEventListener('click',()=>quickShowTab('profiles'));
          const quickDiscoverButton=$('quickDiscoverBtn');
          if(quickDiscoverButton)quickDiscoverButton.addEventListener('click',()=>{
            quickShowTab('tools');
            setTimeout(()=>{
              const toggle=$('spSources'),fetchButton=$('spFetch');
              if(toggle&&!toggle.checked){toggle.checked=true;toggle.dispatchEvent(new Event('change'));}
              if(fetchButton&&!fetchButton.disabled){fetchButton.click();quickStatus('در حال بررسی منابع عمومی. نتایج را دستی بررسی کن؛ کانفیگ‌های عمومی غیرفعال وارد می‌شوند.','ok');}
              else quickStatus('بخش منابع عمومی در ابزارها آماده نشد؛ به تب ابزارها برو و Speed Booster را بررسی کن.','bad');
            },120);
          });
          const quickSpeedButton=$('quickSpeedBtn');
          if(quickSpeedButton)quickSpeedButton.addEventListener('click',()=>{
            quickShowTab('tools');
            setTimeout(()=>{
              const boost=$('spEnabled'),test=$('spTestEnabled'),run=$('spRun');
              if(boost&&!boost.checked){boost.checked=true;boost.dispatchEvent(new Event('change'));}
              if(test&&!test.checked){test.checked=true;test.dispatchEvent(new Event('change'));}
              if(run&&!run.disabled){run.click();quickStatus('تست واقعی آغاز شد. مصرف اینترنت متناسب با تعداد کانفیگ‌ها و اندازهٔ تست است؛ در پایان اتصال قطع می‌ماند.','ok');}
              else quickStatus('برای تست واقعی باید APK دارای Native Bridge جدید و حداقل یک کانفیگ فعال داشته باشی.','bad');
            },160);
          });
          '''
          if 'function quickImportText(text)' not in h:
              if js_marker not in h:
                  raise SystemExit("Could not locate JS insertion point")
              h = h.replace(js_marker, js_marker + "\n" + quick_js, 1)
          h = h.replace("v0.23.0", "v0.23.1").replace("0.23.0", "0.23.1")
          html.write_text(h)
          # Create matching app launcher assets: green S in a blue circle.
          res = Path("app/src/main/res")
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (Path("app/src/main/assets")).mkdir(parents=True, exist_ok=True)
          (res / "drawable" / "st_icon_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#071321" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          """)
          foreground = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#247BFF" android:pathData="M54,16 C33,16 16,33 16,54 C16,75 33,92 54,92 C75,92 92,75 92,54 C92,33 75,16 54,16 Z"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#3BE88D" android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M72,36 C63,27 45,27 35,34 C25,41 29,50 42,55 L61,62 C75,68 72,81 59,87 C47,92 31,88 26,80"/>
          </vector>
          """
          (res / "drawable" / "st_icon_foreground.xml").write_text(foreground)
          monochrome = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="@android:color/transparent" android:strokeColor="#000000" android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M72,36 C63,27 45,27 35,34 C25,41 29,50 42,55 L61,62 C75,68 72,81 59,87 C47,92 31,88 26,80"/>
          </vector>
          """
          (res / "drawable" / "st_icon_monochrome.xml").write_text(monochrome)
          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/st_icon_background"/>
              <foreground android:drawable="@drawable/st_icon_foreground"/>
              <monochrome android:drawable="@drawable/st_icon_monochrome"/>
          </adaptive-icon>
          """
          (res / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text(adaptive)
          (res / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text(adaptive)
          svg = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Smart Tunnel green S blue circle"><circle cx="54" cy="54" r="38" fill="#247BFF"/><path d="M72 36 C63 27 45 27 35 34 C25 41 29 50 42 55 L61 62 C75 68 72 81 59 87 C47 92 31 88 26 80" fill="none" stroke="#3BE88D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>"""
          (Path("app/src/main/assets") / "smart_tunnel_icon.svg").write_text(svg)
          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace("versionCode = 220", "versionCode = 230").replace('versionName = "0.22.0"', 'versionName = "0.23.0"')
          g = g.replace("versionCode = 230", "versionCode = 231").replace('versionName = "0.23.0"', 'versionName = "0.23.1"')
          g = g.replace('abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")', 'abiFilters += listOf("arm64-v8a")')
          gradle.write_text(g)
          validator = Path("scripts/validate_project.py")
          v = validator.read_text()
          v = v.replace("Smart Tunnel v0.22.0", "Smart Tunnel v0.23.0")
          v = v.replace("HTML version is 0.22.0", "HTML version is 0.23.0")
          v = v.replace('versionName = "0.22.0"', 'versionName = "0.23.0"')
          v = v.replace("versionCode = 220", "versionCode = 230")
          v = v.replace("Android app version is 0.22.0 / code 220", "Android app version is 0.23.0 / code 230")
          v = v.replace("SmartTunnel-0.22.0-debug-apk", "SmartTunnel-0.23.1-arm64-debug-apk")
          v = v.replace("0.23.0", "0.23.1").replace("code 230", "code 231").replace("versionCode = 230", "versionCode = 231")
          validator.write_text(v)
          embedded_workflow = Path(".github/workflows/android-apk.yml")
          if embedded_workflow.exists():
              ew = embedded_workflow.read_text()
              ew = ew.replace("SmartTunnel-0.22.0-debug-apk", "SmartTunnel-0.23.1-arm64-debug-apk")
              ew = ew.replace("0.22.0", "0.23.0")
              ew = ew.replace("0.23.0", "0.23.1")
              embedded_workflow.write_text(ew)
          print("Applied v0.23.1 glass connect UI, branded launcher icon, and ARM64-only APK configuration")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static source validation
        working-directory: ${{ steps.source.outputs.root }}
        run: python scripts/validate_project.py

      - name: Run Chromium UI regression tests
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke_test.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.root }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Calculate APK checksum
        working-directory: ${{ steps.source.outputs.root }}
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTunnel-0.23.0-arm64-debug-apk
          path: ${{ steps.source.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="SmartTunnel-0.23.1-arm64.apk"
          cp "${{ steps.source.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          if gh release view v0.23.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.23.1 "$APK_NAME" "$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v0.23.1 --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.23.1 "$APK_NAME" "$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Smart Tunnel Pro v0.23.1 (ARM64)" --latest --notes "Mobile-first Persian glass UI, large one-tap connection entry, configuration import, speed-test shortcuts and a custom green-S/blue-circle adaptive launcher icon. Debug-signed APK for direct installation; physical VPN, network leak and Google Play release-signing tests are not implied."
          fi
